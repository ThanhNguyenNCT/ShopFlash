
schema: spec-driven

context: |
  Ngôn ngữ:
  - Toàn bộ proposal, specifications, design, tasks,
    giải thích kỹ thuật và báo cáo triển khai viết bằng tiếng Việt.
  - Giữ nguyên tên file, định danh code, SQL, API và các
    từ khóa/cấu trúc bắt buộc của OpenSpec.
  - Trình bày ngắn gọn, rõ ràng và đúng trọng tâm.

  Project: ShopFlash - Hệ thống thương mại điện tử có Flash Sale.
  Backend: Spring Boot.
  Database: Oracle Database và Redis.

  Nguồn tham chiếu:
  - Assignment_HK261_L01.pdf: yêu cầu môn học.
  - PROJECT_PLAN.md: phạm vi nghiệp vụ và phân chia topic.
  - DATABASE_DESIGN.md: thiết kế dữ liệu và business rules.
  - README, AGENTS.md, source code, migrations và tests hiện tại.

  Nguyên tắc kiến trúc:
  - Oracle là source of truth cho dữ liệu nghiệp vụ.
  - Redis phục vụ search, runtime state và read models.
  - Không tự ý thay đổi kiến trúc hoặc business invariants.
  - Ưu tiên tái sử dụng implementation đã có.
  - Luôn khảo sát source code thực tế trước khi đề xuất thay đổi.
  - Phân biệt rõ chức năng đã implement và chức năng mới thiết kế.
  - Chỉ thay đổi các module liên quan đến phạm vi được giao.

rules:
  proposal:
    - Xác định hiện trạng, mục tiêu, phạm vi và ngoài phạm vi.
    - Nêu các module bị ảnh hưởng và phần có thể tái sử dụng.

  specs:
    - Viết yêu cầu và kịch bản bằng tiếng Việt.
    - Giữ nguyên cú pháp Requirement, Scenario, WHEN và THEN.
    - Bao quát success, failure và edge cases.
    - Mỗi requirement phải có tiêu chí kiểm chứng rõ ràng.

  design:
    - Trình bày kiến trúc, data flow và quyết định kỹ thuật.
    - Giải thích các lựa chọn và trade-off quan trọng.
    - Chỉ rõ các thành phần mới và thành phần có sẵn.

  tasks:
    - Chia task theo thứ tự phụ thuộc và có thể triển khai độc lập.
    - Mỗi task có phạm vi, kết quả mong đợi và cách kiểm chứng.
    - Bao gồm implementation, testing và documentation.
    - Không tạo task trùng với chức năng đã hoàn thành.

operations:
  apply:
    guidance:
      - Đọc lại thiết kế và code liên quan trước khi sửa.
      - Triển khai từng task, không mở rộng scope.
      - Chạy các bài test phù hợp trước khi hoàn thành task.
      - Không tự động commit hoặc push.

  archive:
    guidance:
      - Kiểm tra sự nhất quán giữa specs và implementation.
      - Tóm tắt kết quả hoàn thành bằng tiếng Việt.
