spring.application.name=shopflash-backend

# JWT F0: đặt secret Base64 ngẫu nhiên >= 32 byte trong .env, không có giá trị mặc định.
shopflash.auth.jwt-secret-base64=${JWT_SECRET_BASE64:}
shopflash.auth.jwt-issuer=https://shopflash.local
shopflash.auth.jwt-audience=shopflash-api
shopflash.auth.jwt-ttl=PT30M

# Local chỉ nghe trên máy mình; môi trường triển khai khác phải cấu hình mạng và secret riêng.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_DATABASE:FREEPDB1}
spring.datasource.username=${ORACLE_SCHEMA:SHOP}
spring.datasource.password=${ORACLE_APP_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway chạy bằng user ứng dụng (mặc định SHOP), lịch sử nằm trong schema đó.
spring.flyway.enabled=true
spring.flyway.user=${ORACLE_SCHEMA:SHOP}
spring.flyway.password=${ORACLE_APP_PASSWORD}
spring.flyway.default-schema=${ORACLE_SCHEMA:SHOP}
spring.flyway.locations=classpath:db/migration
# DB từng chạy profile dev có seed R__ trong lịch sử; profile khác không có file đó nên bỏ qua
# repeatable bị thiếu. Versioned bị thiếu vẫn báo lỗi.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.sql.init.mode=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}

# Module query: thời gian giữ kết quả báo cáo trong Redis (source=cache).
shopflash.query.cache-ttl=PT5M
